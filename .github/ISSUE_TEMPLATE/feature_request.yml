name: Feature request
description: Suggest an improvement or new capability.
title: "Feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and why does it matter?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe other approaches or workarounds.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Add screenshots, examples, or related links.
