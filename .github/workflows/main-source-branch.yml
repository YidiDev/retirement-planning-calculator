name: Main PR Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  require-staging-source:
    name: require-staging-source
    runs-on: ubuntu-latest
    steps:
      - name: Require staging source branch
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "Pull requests into main must come from staging."
            echo "Current source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Source branch is staging."
